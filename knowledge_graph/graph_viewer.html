<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG_PRJ_1 · Knowledge Graph Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.js"></script>
<link  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/dist/vis-network.min.css" />
<script src="graph_data.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg:       #080b14;
    --surface:  #0d1220;
    --border:   #1c2438;
    --accent:   #5b8af5;
    --accent2:  #e05cff;
    --txt:      #c8d3f0;
    --txt-dim:  #4a5680;
    --success:  #3ddc97;
    --warn:     #f5c842;
    --danger:   #f05e72;

    --node-person:       #60a5fa;
    --node-organization: #34d399;
    --node-concept:      #a78bfa;
    --node-technology:   #fb923c;
    --node-method:       #22d3ee;
    --node-dataset:      #fbbf24;
    --node-metric:       #f472b6;
    --node-query:        #ef4444;
    --node-claim:        #4ade80;
    --node-chunk:        #94a3b8;
    --node-default:      #5b8af5;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Syne', sans-serif;
    height: 100dvh;
    display: grid;
    grid-template-rows: 52px 1fr;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    gap: 12px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .tabs {
    display: flex;
    gap: 3px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }
  .tab {
    padding: 5px 14px;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--txt-dim);
    transition: all .18s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--txt); }
  .tab.active { background: var(--accent); color: #fff; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .conf-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .conf-HIGH   { background: #0e3327; color: var(--success); border: 1px solid #1a5c3d; }
  .conf-MEDIUM { background: #2e2500; color: var(--warn);    border: 1px solid #5c4600; }
  .conf-LOW    { background: #2e0e12; color: var(--danger);  border: 1px solid #5c1a20; }
  .conf-NA     { background: #1a1f2e; color: var(--txt-dim); border: 1px solid var(--border); }

  /* ── Layout ──────────────────────────────────────────── */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 280px;
    overflow: hidden;
  }

  /* ── Graph area ──────────────────────────────────────── */
  .graph-area { position: relative; overflow: hidden; }

  .graph-panel { position: absolute; inset: 0; display: none; }
  .graph-panel.active { display: block; }

  .no-data-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--txt-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    display: none;
  }
  .no-data-overlay .icon { font-size: 40px; }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--txt-dim);
    margin-bottom: 7px;
  }

  .query-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--txt);
    font-style: italic;
  }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  .stat-label { font-size: 10px; color: var(--txt-dim); margin-top: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 5px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--txt-dim); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .reasoning-list { display: flex; flex-direction: column; gap: 4px; }
  .reasoning-step {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--txt-dim);
    padding: 5px 8px;
    background: var(--bg);
    border-radius: 5px;
    border-left: 2px solid var(--accent);
    line-height: 1.5;
  }

  .claims-list { display: flex; flex-direction: column; gap: 6px; }
  .claim-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 9px 10px 8px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--txt);
    border-left: 3px solid var(--border);
    cursor: default;
    transition: border-color .15s;
  }
  .claim-card:hover { border-left-color: var(--accent); }
  .claim-card.SUPPORTED    { border-left-color: var(--success); }
  .claim-card.PARTIAL      { border-left-color: var(--warn); }
  .claim-card.NOTSUPPORTED { border-left-color: var(--danger); }
  .claim-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--txt-dim);
    margin-top: 5px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .claim-support {
    font-weight: 600;
    font-size: 10px;
  }
  .claim-support.SUPPORTED    { color: var(--success); }
  .claim-support.PARTIAL      { color: var(--warn); }
  .claim-support.NOTSUPPORTED { color: var(--danger); }

  .empty-state { font-size: 11px; color: var(--txt-dim); font-style: italic; }

  /* ── Tooltip override ────────────────────────────────── */
  .vis-tooltip {
    background: #111827 !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    color: var(--txt) !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 11px !important;
    padding: 6px 10px !important;
    box-shadow: 0 4px 20px #000a !important;
    max-width: 260px !important;
    white-space: pre-wrap !important;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    RAG_PRJ_1 &nbsp;·&nbsp; Knowledge Graph Viewer
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('global')">Global KG</button>
    <button class="tab"        onclick="switchTab('query')">Query KG</button>
    <button class="tab"        onclick="switchTab('merged')">Merged View</button>
  </div>
  <div class="header-right">
    <span class="conf-badge conf-NA" id="conf-badge">—</span>
  </div>
</header>

<div class="workspace">
  <div class="graph-area">
    <div class="graph-panel active" id="panel-global"></div>
    <div class="graph-panel"        id="panel-query"></div>
    <div class="graph-panel"        id="panel-merged"></div>
    <div class="no-data-overlay" id="no-data">
      <div class="icon">🕸</div>
      <div>graph_data.js not found or empty</div>
      <div style="font-size:11px;margin-top:4px">Run a query through RAG_PRJ_1 to populate it</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-scroll">

      <div>
        <div class="section-label">Query</div>
        <div class="query-box" id="query-display">—</div>
      </div>

      <div>
        <div class="section-label">Graph Stats</div>
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card"><div class="stat-val">—</div><div class="stat-label">Global Nodes</div></div>
          <div class="stat-card"><div class="stat-val">—</div><div class="stat-label">Global Edges</div></div>
          <div class="stat-card"><div class="stat-val">—</div><div class="stat-label">Query Nodes</div></div>
          <div class="stat-card"><div class="stat-val">—</div><div class="stat-label">Claims</div></div>
        </div>
      </div>

      <div>
        <div class="section-label">Node Legend</div>
        <div class="legend" id="legend"></div>
      </div>

      <div>
        <div class="section-label">Reasoning Path</div>
        <div class="reasoning-list" id="reasoning-list">
          <div class="empty-state">No reasoning path available</div>
        </div>
      </div>

      <div>
        <div class="section-label">Evidence Claims</div>
        <div class="claims-list" id="claims-list">
          <div class="empty-state">No claims available</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────

const NODE_COLORS = {
  person:       '#60a5fa',
  organization: '#34d399',
  concept:      '#a78bfa',
  technology:   '#fb923c',
  method:       '#22d3ee',
  dataset:      '#fbbf24',
  metric:       '#f472b6',
  query:        '#ef4444',
  claim:        '#4ade80',
  chunk:        '#94a3b8',
  location:     '#38bdf8',
  event:        '#e879f9',
  default:      '#5b8af5',
};

const NODE_SHAPES = {
  query: 'star',
  claim: 'diamond',
  chunk: 'box',
};

const EDGE_COLORS = {
  relates_to:   '#334155',
  derived_from: '#3b4f7a',
  supported_by: '#1a4731',
  contradicts:  '#4a1a1a',
  default:      '#2a3550',
};

const LEGEND_TYPES = [
  'person','organization','concept','technology',
  'method','dataset','metric','query','claim','chunk',
];

const NETWORK_OPTIONS = {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.004,
      springLength: 120,
      springConstant: 0.04,
      avoidOverlap: 0.6,
    },
    stabilization: { iterations: 200, updateInterval: 20 },
  },
  interaction: {
    hover: true,
    tooltipDelay: 80,
    zoomView: true,
    dragView: true,
    multiselect: false,
  },
  edges: {
    smooth: { type: 'curvedCW', roundness: 0.12 },
    scaling: { min: 1, max: 2 },
  },
  nodes: {
    scaling: { min: 10, max: 26 },
    font: { face: 'JetBrains Mono', size: 10 },
  },
};

// ── State ─────────────────────────────────────────────────────────────────────

const networks  = {};
let   activeTab = 'global';

// ── Helpers ───────────────────────────────────────────────────────────────────

function color(type) {
  return NODE_COLORS[(type || '').toLowerCase()] || NODE_COLORS.default;
}

function edgeColor(relation) {
  return EDGE_COLORS[(relation || '').toLowerCase()] || EDGE_COLORS.default;
}

function truncate(str, n) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function buildVisNodes(nodes, isQueryGraph = false) {
  return nodes.map(n => {
    const c   = color(n.type);
    const isNew = isQueryGraph && n.status === 'new';
    return {
      id:    n.id,
      label: truncate(n.label || n.name || n.id, 22),
      title: [
        `${n.name || n.id}`,
        `Type: ${n.type || '?'}`,
        n.source_pdf ? `Source: ${n.source_pdf}` : '',
        isQueryGraph ? `Status: ${n.status || '?'}` : '',
      ].filter(Boolean).join('\n'),
      color: {
        background: c,
        border: isNew ? '#f59e0b' : '#1e293b',
        highlight: { background: c, border: '#ffffff' },
        hover:     { background: c, border: '#94a3b8' },
      },
      borderWidth:         isNew ? 3 : 1,
      borderWidthSelected: 3,
      font:  { color: '#ffffff', size: 10, face: 'JetBrains Mono' },
      shape: NODE_SHAPES[n.type] || 'dot',
      size:  n.type === 'query' ? 24 : n.type === 'claim' ? 18 : 13,
    };
  });
}

function buildVisEdges(edges) {
  return edges.map((e, i) => ({
    id:     i,
    from:   e.source,
    to:     e.target,
    label:  (e.relation || '').toLowerCase().replace(/_/g, ' '),
    arrows: 'to',
    color:  { color: edgeColor(e.relation), highlight: '#5b8af5', hover: '#7c8cf8' },
    font:   { size: 8, color: '#3d4f70', align: 'middle', face: 'JetBrains Mono' },
    smooth: { type: 'curvedCW', roundness: 0.12 },
  }));
}

function initNetwork(panelId, nodes, edges, isQueryGraph = false) {
  const container = document.getElementById(panelId);
  if (!container || !nodes.length) return null;
  const dataset = {
    nodes: new vis.DataSet(buildVisNodes(nodes, isQueryGraph)),
    edges: new vis.DataSet(buildVisEdges(edges)),
  };
  const net = new vis.Network(container, dataset, NETWORK_OPTIONS);
  net.once('stabilizationIterationsDone', () => net.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } }));
  return net;
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderAll(data) {
  const gs = data.global_subgraph || { nodes: [], edges: [] };
  const qg = data.query_graph     || { nodes: [], edges: [] };

  // Global KG
  networks.global = initNetwork('panel-global', gs.nodes, gs.edges, false);

  // Query KG
  networks.query = initNetwork('panel-query', qg.nodes, qg.edges, true);

  // Merged view — deduplicate nodes by id
  const globalIds   = new Set(gs.nodes.map(n => n.id));
  const mergedNodes = [
    ...gs.nodes.map(n => ({ ...n, status: 'existing' })),
    ...qg.nodes
      .filter(n => !globalIds.has(n.id))
      .map(n => ({ ...n, status: n.status || 'new' })),
  ];
  const seenEdges = new Set();
  const mergedEdges = [...gs.edges, ...qg.edges].filter(e => {
    const key = `${e.source}→${e.target}→${e.relation}`;
    if (seenEdges.has(key)) return false;
    seenEdges.add(key);
    return true;
  });
  networks.merged = initNetwork('panel-merged', mergedNodes, mergedEdges, true);

  renderSidebar(data, gs, qg);
}

function renderSidebar(data, gs, qg) {
  // Query
  document.getElementById('query-display').textContent = data.query || '—';

  // Confidence
  const conf = (data.confidence || 'NA').replace(/\s/g, '');
  const badge = document.getElementById('conf-badge');
  badge.textContent  = data.confidence || '—';
  badge.className    = `conf-badge conf-${conf}`;

  // Stats
  document.getElementById('stats-grid').innerHTML = [
    [gs.nodes.length,  'Global Nodes'],
    [gs.edges.length,  'Global Edges'],
    [qg.nodes.length,  'Query Nodes'],
    [(data.claims || []).length, 'Claims'],
  ].map(([v, l]) => `
    <div class="stat-card">
      <div class="stat-val">${v}</div>
      <div class="stat-label">${l}</div>
    </div>
  `).join('');

  // Legend
  document.getElementById('legend').innerHTML = LEGEND_TYPES.map(t => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${color(t)}"></div>
      ${t}
    </div>
  `).join('');

  // Reasoning path
  const steps = data.reasoning_path || [];
  document.getElementById('reasoning-list').innerHTML = steps.length
    ? steps.map(s => `<div class="reasoning-step">${s}</div>`).join('')
    : '<div class="empty-state">No reasoning path available</div>';

  // Claims
  const claims = data.claims || [];
  document.getElementById('claims-list').innerHTML = claims.length
    ? claims.map(c => {
        const supportKey = (c.support || '').replace(/\s/g, '');
        return `
          <div class="claim-card ${supportKey}">
            ${c.claim || ''}
            <div class="claim-meta">
              <span class="claim-support ${supportKey}">${c.support || '?'}</span>
              ${c.chunk_id   ? `<span>${c.chunk_id}</span>`   : ''}
              ${c.source_pdf ? `<span>${c.source_pdf}</span>` : ''}
            </div>
          </div>
        `;
      }).join('')
    : '<div class="empty-state">No claims available</div>';
}

// ── Tab switching ─────────────────────────────────────────────────────────────

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((btn, i) => {
    btn.classList.toggle('active', ['global', 'query', 'merged'][i] === tab);
  });
  document.querySelectorAll('.graph-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  if (networks[tab]) {
    networks[tab].fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────

(function init() {
  try {
    if (typeof GRAPH_DATA === 'undefined' || !GRAPH_DATA) throw new Error('no data');
    const hasNodes =
      (GRAPH_DATA.global_subgraph?.nodes?.length || 0) +
      (GRAPH_DATA.query_graph?.nodes?.length || 0);
    if (!hasNodes) throw new Error('empty');
    renderAll(GRAPH_DATA);
  } catch (_) {
    document.getElementById('no-data').style.display = 'flex';
  }
})();
</script>
</body>
</html>
